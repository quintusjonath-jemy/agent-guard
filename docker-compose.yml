services:
  mysql:
    image: mariadb:10.11
    container_name: agentguard-mysql
    restart: unless-stopped
    command: --innodb-use-native-aio=0
    environment:
      MYSQL_DATABASE: agentguard_db
      MYSQL_USER: agentguard_user
      MYSQL_PASSWORD: agentguard_secure_password
      MYSQL_ROOT_PASSWORD: root_secure_password
      MARIADB_DATABASE: agentguard_db
      MARIADB_USER: agentguard_user
      MARIADB_PASSWORD: agentguard_secure_password
      MARIADB_ROOT_PASSWORD: root_secure_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - agentguard-network

  redis:
    image: redis:7-alpine
    container_name: agentguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agentguard-network

  backend:
    build:
      context: ./agentguard-backend
      dockerfile: Dockerfile
    container_name: agentguard-backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=mysql+pymysql://agentguard_user:agentguard_secure_password@mysql:3306/agentguard_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super-secret-agentguard-jwt-key-change-in-production-min-32-chars-long
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:5678
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/agent-webhook
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    networks:
      - agentguard-network

  worker:
    build:
      context: ./agentguard-backend
      dockerfile: Dockerfile
    container_name: agentguard-worker
    restart: unless-stopped
    command: celery -A app.workers.tasks.celery_app worker --loglevel=info
    environment:
      - APP_ENV=production
      - DATABASE_URL=mysql+pymysql://agentguard_user:agentguard_secure_password@mysql:3306/agentguard_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super-secret-agentguard-jwt-key-change-in-production-min-32-chars-long
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/agent-webhook
    depends_on:
      - mysql
      - redis
    networks:
      - agentguard-network

  frontend:
    build:
      context: ./agentguard-frontend
      dockerfile: Dockerfile
    container_name: agentguard-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - agentguard-network

  # ── n8n: Autonomous Agent Orchestration Engine ─────────────
  # Sits on the same Docker network so it can reach:
  #   backend  →  http://backend:8000
  #   redis    →  redis://redis:6379
  # The agentguard-n8n-workflow.json can be imported as-is.
  n8n:
    image: n8nio/n8n:latest
    container_name: agentguard-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      # Webhook URL shown in the n8n UI (host-visible address)
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      # Disable telemetry / onboarding
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_CORS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - backend
    networks:
      - agentguard-network

networks:
  agentguard-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  n8n_data:
